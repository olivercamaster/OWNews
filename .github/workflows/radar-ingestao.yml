# Radar Offshore — ingestão dos dados públicos da ANP (substitui o cron do VPS em 2026-11-28).
# Código: branch owbuddy/dev (o que está em produção). Estado entre execuções: branch radar-estado.
name: Radar — ingestão ANP
on:
  schedule:
    - cron: '10 10 * * *'                  # completa (ANP), 07:10 BRT
    - cron: '40 1,4,13,16,19,22 * * *'     # só notícias ligadas às fichas
  workflow_dispatch:
    inputs:
      modo:
        description: 'completo | so-noticias | seco (não envia)'
        default: so-noticias
concurrency: { group: radar-ingestao, cancel-in-progress: false }
permissions: { contents: write, actions: write }
jobs:
  ingestao:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { ref: owbuddy/dev, path: codigo, sparse-checkout: ownews-radar }
      - uses: actions/checkout@v4
        with: { ref: radar-estado, path: estado }
      - uses: actions/cache@v4
        with: { path: estado/fontes, key: 'radar-fontes-${{ github.run_id }}', restore-keys: radar-fontes- }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Ingestão
        env:
          RADAR_ESTADO: ${{ github.workspace }}/estado
          RADAR_WORKER_URL: https://ownews-radar.olivercamaster.workers.dev
          # gov.br recusa IP de fora do Brasil: o download da ANP passa pelo worker (/interno/baixar).
          RADAR_PROXY_URL: https://ownews-radar.olivercamaster.workers.dev
          RADAR_INGEST_SECRET: ${{ secrets.RADAR_INGEST_SECRET }}
          EVENTO: ${{ github.event_name }}
          AGENDA: ${{ github.event.schedule }}
          MODO: ${{ inputs.modo }}
        run: |
          ARG=""
          if [ "$EVENTO" = schedule ] && [ "$AGENDA" != "10 10 * * *" ]; then ARG="--so-noticias"; fi
          if [ "$EVENTO" = workflow_dispatch ]; then case "$MODO" in so-noticias) ARG="--so-noticias";; seco) ARG="--seco";; esac; fi
          cd codigo/ownews-radar && node ingestao/run.mjs $ARG
          tail -n 5 "$RADAR_ESTADO/ingestao.log" || true
      - name: Guardar estado
        working-directory: estado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || { git commit -q -m "radar: estado $(date -u +%FT%TZ)"; git push -q; }
      # Repositório público: o GitHub desliga agendamentos após 60 dias sem atividade. Reativa os dois a cada execução.
      - name: Manter agendamentos ativos
        if: always()
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: gh workflow enable radar-ingestao.yml && gh workflow enable instagram-arte.yml
